# 매일 1회 브랜드 리스크 진단을 다시 산출하고 결과를 저장소에 반영한다.
#
# 왜 GitHub Actions 인가
#   Streamlit Community Cloud 는 앱 컨테이너 안에서 배치를 돌릴 수단이 없다.
#   저장소가 갱신되면 앱이 자동으로 다시 뜨므로, 갱신은 여기서 하고 결과만 커밋한다.
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions)
#   NCP_API_KEY_ID / NCP_API_KEY   — 네이버 API HUB (검색 + 검색어트렌드)
#   없으면 해당 단계는 스스로 건너뛰고 진단만 다시 돌린다.
name: daily-refresh

on:
  schedule:
    # 매일 21:00 UTC = 한국시간 06:00. 심사역이 출근하기 전에 끝나 있어야 한다.
    - cron: "0 21 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:                # 앞 실행이 남아 있으면 겹쳐 돌지 않게
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 리스크 진단 갱신
        env:
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python tools/daily_refresh.py

      - name: 변경분 커밋
        run: |
          git config user.name  "franscore-bot"
          git config user.email "actions@github.com"
          git add outputs/ data/raw/news data/raw/naver 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            SUMMARY=$(python -c "import json;s=json.load(open('outputs/refresh_state.json',encoding='utf-8'));print(f\"뉴스 +{s['news_added']} · 수요 +{s['demand_updated']} · 진단 {s['rescored']}개\")")
            git commit -m "일간 갱신 — $SUMMARY"
            git push
          fi
